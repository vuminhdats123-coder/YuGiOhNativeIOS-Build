name: Native EDOPro readiness (build on hold)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned native sources
        run: |
          git submodule update --init --depth 1 NativeClient/edopro NativeClient/distribution
          git -C NativeClient/edopro submodule update --init --recursive --depth 1 ocgcore
      - name: Apply reviewed iOS bootstrap patch
        run: python tools/apply_native_patches.py
      # Never publish another catalog/prototype IPA as the complete game.
      - name: Require native game readiness
        run: python tools/check_native_port.py --require-ready


